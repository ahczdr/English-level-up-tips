name: CI

on:
  pull_request:
    paths-ignore:
      - 'apps/**'
      - 'planning/**'
  push:
    branches: [master]
    paths-ignore:
      - 'apps/**'
      - 'planning/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-pdf.txt
      # GHSA-vfj7-8cjw-p6xm：braces 全版本被标记且尚无修复版，globby/micromatch 链路无法规避；
      # 审计降级为非阻断 + 警告注记（有修复版发布后应恢复阻断并升级）
      - run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::npm audit reports upstream advisories without a fixed version yet (braces GHSA-vfj7-8cjw-p6xm chain). Re-enable as blocking once a patched release ships."
          fi
      - run: npm run check
      - run: npm run docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: docs/.vitepress/dist/
          retention-days: 14
      - name: Generated files are committed
        run: |
          npm run sync:content
          git diff --exit-code

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
