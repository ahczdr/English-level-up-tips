name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    # CR63：app/规划目录的改动由 english-practice-ci 负责，不触发全书构建部署
    paths-ignore:
      - 'apps/**'
      - 'planning/**'
  # 应用合并进 master 后自动上线（CI 全绿后才触发 workflow_run，无需手动 dispatch）
  workflow_run:
    workflows: [CI, english-practice-ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # CR16：fork 未启用 Pages 时自动开启，避免 configure-pages 恒红
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: npm ci
      - run: python -m pip install -r requirements-pdf.txt
      - run: npm run check
      - run: npm run docs:build
      # 应用随书稿同站发布：/app/ 子路径（PWA manifest 与 SW 均为相对作用域）
      - name: Build english-practice app (subpath)
        working-directory: apps/english-practice
        run: |
          npm ci
          npm run build:release
        env:
          BUILD_SHA: "${{ github.sha }}"
          VITE_BASE: "/English-level-up-tips/app/"
      - name: Copy app into site output
        run: cp -r apps/english-practice/dist docs/.vitepress/dist/app
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published entry points
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          entries=(
            $'/|人生进阶指南'
            $'/en/|Life Level-up Guide'
            $'/threads/part-3/5-evidence-and-transfer|证据篇：变化要如何被看见'
            $'/en/threads/part-3/5-evidence-and-transfer|Evidence: How Change Becomes Visible'
          )
          for entry in "${entries[@]}"; do
            IFS='|' read -r path expected_title <<< "$entry"
            url="${PAGE_URL%/}${path}"
            body="$(curl --fail --location --retry 8 --retry-delay 5 --connect-timeout 15 --max-time 45 "$url")"
            if ! grep -Fq "$expected_title" <<< "$body"; then
              printf 'Unexpected title for %s; expected %s\n' "$url" "$expected_title" >&2
              exit 1
            fi
            if ! grep -Fq "name=\"build-revision\" content=\"$EXPECTED_SHA\"" <<< "$body"; then
              printf 'Unexpected build revision for %s; expected %s\n' "$url" "$EXPECTED_SHA" >&2
              exit 1
            fi
          done
          downloads=(
            $'/downloads/life-level-up-guide-zh.epub|application/epub+zip|0-3|504b0304'
            $'/downloads/life-level-up-guide-en.epub|application/epub+zip|0-3|504b0304'
            $'/downloads/life-level-up-guide-zh.pdf|application/pdf|0-4|255044462d'
            $'/downloads/life-level-up-guide-en.pdf|application/pdf|0-4|255044462d'
          )
          for entry in "${downloads[@]}"; do
            IFS='|' read -r path expected_type byte_range expected_signature <<< "$entry"
            url="${PAGE_URL%/}${path}"
            headers="$(curl --fail --head --location --retry 8 --retry-delay 5 --connect-timeout 15 --max-time 45 "$url")"
            if ! grep -Fiq "content-type: ${expected_type}" <<< "$headers"; then
              printf 'Unexpected content type for %s; expected %s\n' "$url" "$expected_type" >&2
              exit 1
            fi
            signature="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --connect-timeout 15 --max-time 45 --range "$byte_range" "$url" | od -An -tx1 | tr -d ' \n')"
            if [[ "$signature" != "$expected_signature" ]]; then
              printf 'Unexpected file signature for %s; expected %s, received %s\n' "$url" "$expected_signature" "$signature" >&2
              exit 1
            fi
          done
