# T14：english-practice CI（仓库级）。
# 门禁：content 校验 + typecheck + lint + 单元测试 + 生产构建 + 双配置 E2E（Chromium/Firefox/WebKit 基础流程）。
# 失败保留 Playwright trace 与截图（仅存于 Actions artifacts，不对外发布；报告不含学习正文外发）。
# E2E 使用 VITE_E2E=true 构建提供固定 fixtures 与测试时钟桥；发布冒烟（smoke job）另跑不含 VITE_E2E 的构建。
name: english-practice-ci

on:
  push:
    branches: [master]
    paths:
      - 'apps/english-practice/**'
      - '.github/workflows/english-practice-ci.yml'
  pull_request:
    paths:
      - 'apps/english-practice/**'
      - '.github/workflows/english-practice-ci.yml'

# CR32：同分支 push + pull_request 双事件会各跑一遍；连跑 commit 直接取消在途 run
concurrency:
  group: english-practice-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/english-practice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/english-practice/package-lock.json
      - name: Install dependencies
        run: npm ci
      # CR33：Playwright 浏览器二进制缓存（key 含版本解析后的 lockfile 与浏览器集合）
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-full-${{ hashFiles('apps/english-practice/package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check (content + typecheck + lint + unit)
        run: npm run check
      - name: Production build (no VITE_E2E)
        run: npm run build:release
        env:
          BUILD_SHA: "${{ github.sha }}"
      # CR29：CI 已单独跑过 check，E2E 构建跳过重复的 typecheck/content 前置门禁
      - name: E2E (E2E build + preview 4174 + offline suite)
        run: SKIP_GATE=1 npm run test:e2e
      - name: Collect failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: |
            apps/english-practice/test-results/
            apps/english-practice/playwright-report/
            apps/english-practice/playwright-report-offline/
          retention-days: 7

  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    defaults:
      run:
        working-directory: apps/english-practice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/english-practice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ hashFiles('apps/english-practice/package-lock.json') }}
      - name: Install Playwright Chromium (smoke only)
        run: npx playwright install --with-deps chromium
      - name: Release build (no VITE_E2E)
        run: npm run build:release
        env:
          BUILD_SHA: "${{ github.sha }}"
      # T15/B4：仅允许已分类的发布就绪缺口暂缓；素材、schema、脚本等错误仍必须阻断 CI。
      - name: Release content gate (T15)
        run: |
          if npm run content:release; then
            exit 0
          else
            status=$?
            if [ "$status" -ne 78 ]; then
              exit "$status"
            fi
            echo "::notice::Release readiness gaps remain; integrity and tooling checks passed."
          fi
      # R3：release 已由上一步构建，smoke 脚本内不再重复 build（脚本检测 dist 存在即用）
      - name: Release smoke (shell + no test entry + SW)
        run: node scripts/smoke-release.mjs
        env:
          BUILD_SHA: "${{ github.sha }}"
